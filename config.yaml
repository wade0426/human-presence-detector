version: 2
source:
  type: rtsp
  rtsp_url: rtsp://127.0.0.1:554/live
  webcam_index: 0
  reconnect_interval_sec: 5.0
detection:
  model_path: data/model/yolov8n.pt
  device: auto
  confidence: 0.4
  interval_sec: 1.0
  min_box_height_ratio: 0.25
presence:
  roi:
  - 0.3081510934393638
  - 0.010638297872340425
  - 0.4612326043737575
  - 0.975177304964539
  debounce_count: 3
timer:
  work_threshold_min: 0.1
  reset_threshold_min: 0.1
  required_rest_min: 0.1
  rest_count_mode: presence
rest_flow:
  pending_accounting: work
  interrupt_behavior: remind
  rest_interrupt_after_sec: 15.0
  escalation:
    max_stage: 3
    stage_after_sec:
    - 15.0
    - 30.0
    - 45.0
    apply_to_reminding: true
reminder:
  method: popup
  repeat_interval_min: 0.2
  reminding_display_mode: work_and_reminder
  popup:
    media_path: D:/Code/Python/human-presence-detector/data/assets/rest.jpg
    media_type: image
    sound_path: D:/Code/Python/human-presence-detector/data/assets/Radar.mp3
  floating:
    position: top-right
  return_sound:
    enabled: true
    sound_path: D:/Code/Python/human-presence-detector/data/assets/Radar.mp3
logging:
  enabled: false
  db_path: data/records.sqlite
ui:
  start_minimized: false
